on: push
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poznan_it_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - name: Migrate database schema
        env:
          PGPASSWORD: postgres
        run: |
          for file in sql/ddl/*.sql; do
            psql -h localhost -U postgres -d poznan_it_market -v ON_ERROR_STOP=1 -f "$file" || exit 1
          done
      - name: Prepare test database
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres poznan_it_market_test
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/001_raw_schema.sql
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/003_rejected_records.sql
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/004_ingestion_runs.sql
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/006_ingestion_run_errors.sql
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/007_offer_data_mode.sql
          psql -h localhost -U postgres -d poznan_it_market_test -v ON_ERROR_STOP=1 -f sql/ddl/008_ingestion_run_context.sql
      - name: Run Python tests
        run: uv run pytest
        env:
          JJIT_API_URL: "https://justjoin.it/api/candidate-api/offers"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
      - name: Load deterministic CI data
        run: uv run python scripts/load_ci_fixture.py
        env:
          JJIT_API_URL: "https://justjoin.it/api/candidate-api/offers"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
      - name: Prepare dbt configuration
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          uv run python scripts/export_dbt_env.py
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
      - name: Run dbt build
        run: |
          uv run dbt build --project-dir dbt --profiles-dir dbt --vars '{"data_mode": "demo", "expected_date": "2026-08-11"}'
      - name: Verify CI fixture results
        run: uv run python scripts/check_ci_results.py
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
