"on": push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JJIT_API_URL: "https://justjoin.it/api/candidate-api/offers"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
      DEMO_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_demo"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poznan_it_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Check source types
        run: uv run --locked mypy src

      - name: Prepare isolated test and demo databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres poznan_it_market_demo
          for database in poznan_it_market_test poznan_it_market_demo; do
            for file in sql/ddl/*.sql; do
              psql -X -h localhost -U postgres -d "$database" \
                -v ON_ERROR_STOP=1 -f "$file" || exit 1
            done
          done

      - name: Run Python tests
        run: uv run --locked pytest

      - name: Load deterministic CI data
        run: uv run --locked python scripts/load_ci_fixture.py

      - name: Build models for the CI fixture
        env:
          DEMO_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/poznan_it_market_test"
        run: |
          uv run --locked python scripts/build_dbt.py \
            --mode demo --expected-date 2026-08-11

      - name: Verify exact CI results
        run: uv run --locked python scripts/check_results.py --mode ci

      - name: Run the complete public demo command
        run: make demo

      - name: Verify demo data and reports
        run: uv run --locked python scripts/check_results.py --mode demo
