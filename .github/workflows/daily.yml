name: Daily Data Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * *'
concurrency:
  group: poznan-it-market-live
  cancel-in-progress: false
  queue: max
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JJIT_API_URL: "https://justjoin.it/api/candidate-api/offers"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ingest raw data
        run: make ingest
      - name: Setup dbt profiles and credentials
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          uv run python scripts/export_dbt_env.py
      - name: Check live data freshness
        run: uv run dbt source freshness --project-dir dbt --profiles-dir dbt --select source:raw.offers
      - name: Run dbt build
        run: make dbt
      - name: Generate analytics charts
        run: |
          rm -f docs/img/*.png
          make charts
      - name: Archive generated charts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: market-charts
          path: docs/img/*.png
          if-no-files-found: error
      - name: Archive diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: dbt/logs/dbt.log
