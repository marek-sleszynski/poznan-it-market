name: Daily Data Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * *'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JJIT_API_URL: "https://api.justjoin.it/v2/user-panel/offers"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ingest raw data
        run: make ingest
      - name: Setup dbt profiles and credentials
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          python -c "
          import os, urllib.parse
          url = urllib.parse.urlparse(os.environ['DATABASE_URL'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DB_HOST={url.hostname}\n')
              f.write(f'DB_PORT={url.port or 5432}\n')
              f.write(f'POSTGRES_USER={url.username}\n')
              f.write(f'POSTGRES_PASSWORD={url.password}\n')
              f.write(f'POSTGRES_DB={url.path.lstrip(\"/\")}\n')
              f.write('DB_SSLMODE=require\n')
          "
      - name: Run dbt snapshots
        run: make snapshot
      - name: Run dbt build
        run: make dbt
      - name: Generate analytics charts
        run: make charts
      - name: Archive generated charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-charts
          path: docs/img/*.png
      - name: Archive diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: dbt/logs/dbt.log
