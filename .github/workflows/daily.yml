name: Daily Data Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * *'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JJIT_API_URL: "https://api.justjoin.it/v2/user-panel/offers"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ingest raw data
        run: make ingest
      - name: Run dbt snapshots
        run: make snapshot
      - name: Run dbt build
        run: make dbt
