version: 2

models:
  - name: dim_company
    columns:
      - name: company_key
        tests:
          - unique
          - not_null
      - name: company_name
        tests:
          - not_null

      - name: company_name_normalized
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fct_offer_snapshot
    columns:
      - name: raw_offer_id
        tests:
          - not_null
      - name: source
        tests:
          - not_null

      - name: source_offer_id
        tests:
          - not_null
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
  - name: fct_offer_skill
    columns:
      - name: raw_offer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_offer_snapshot')
                field: raw_offer_id

      - name: date_id
        tests:
          - not_null

      - name: source
        tests:
          - not_null

      - name: source_offer_id
        tests:
          - not_null

      - name: skill_name
        tests:
          - not_null
