version: 2

models:
  - name: dim_company
    columns:
      - name: company_key
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fct_offer_snapshot
    columns:
      - name: raw_offer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_offers')
              field: raw_offer_id

      - name: company_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_company')
              field: company_key

      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
